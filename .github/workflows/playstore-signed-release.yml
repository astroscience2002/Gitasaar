name: Build Signed Play Store AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: GitaSaar_Android_App_Source/GitaSaarAndroid
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Include all 18 chapter images in signed release
        working-directory: .
        run: |
          mkdir -p /tmp/krishna-images
          unzip -oq GitaSaar_18_Images_Integrated_Source.zip -d /tmp/krishna-images
          mkdir -p GitaSaar_Android_App_Source/GitaSaarAndroid/app/src/main/assets/krishna
          cp /tmp/krishna-images/GitaSaarAndroid/app/src/main/assets/krishna/*.webp GitaSaar_Android_App_Source/GitaSaarAndroid/app/src/main/assets/krishna/
          python3 - <<'PY'
          from pathlib import Path
          root=Path("GitaSaar_Android_App_Source/GitaSaarAndroid/app/src/main/assets/krishna")
          files=[root/f"chapter_{i:02}.webp" for i in range(1,19)]
          files += [root/(x+".webp") for x in ("home_banner","guidance_banner","daily_quote","verse_banner")]
          assert all(f.is_file() for f in files), "Missing Krishna artwork in signed release"
          PY
      - name: Bundle original public-domain artwork
        run: python3 scripts/fetch_art.py
      - name: Restore private upload signing key
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then echo "Missing PLAY_UPLOAD_KEYSTORE_B64 secret" >&2; exit 1; fi
          umask 077
          printf "%s" "$UPLOAD_KEYSTORE_B64" | base64 -d > upload-key.jks
      - name: Build signed release AAB
        env:
          PLAY_UPLOAD_KEYSTORE_FILE: upload-key.jks
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ORG_GRADLE_PROJECT_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          if [ -z "$PLAY_UPLOAD_KEY_ALIAS" ] || [ -z "$PLAY_UPLOAD_KEY_PASSWORD" ] || [ -z "$PLAY_UPLOAD_STORE_PASSWORD" ]; then echo "Missing upload key signing secrets" >&2; exit 1; fi
          gradle --no-daemon --stacktrace bundleRelease
      - name: Upload signed Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: GitaSaar-SIGNED-PlayStore-AAB
          if-no-files-found: error
          path: GitaSaar_Android_App_Source/GitaSaarAndroid/app/build/outputs/bundle/release/*.aab
