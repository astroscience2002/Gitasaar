name: Build Android Test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: GitaSaar_Android_App_Source/GitaSaarAndroid

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy only Krishna graphics from uploaded package
        working-directory: .
        run: |
          if [ -f GitaSaar_18_Images_Integrated_Source.zip ]; then
            mkdir -p /tmp/krishna-artwork
            unzip -oq GitaSaar_18_Images_Integrated_Source.zip -d /tmp/krishna-artwork
            mkdir -p GitaSaar_Android_App_Source/GitaSaarAndroid/app/src/main/assets/krishna
            cp /tmp/krishna-artwork/GitaSaarAndroid/app/src/main/assets/krishna/*.webp GitaSaar_Android_App_Source/GitaSaarAndroid/app/src/main/assets/krishna/
          fi
          python3 - <<'PY'
          from pathlib import Path
          d=Path("GitaSaar_Android_App_Source/GitaSaarAndroid/app/src/main/assets/krishna")
          expected=[d/f"chapter_{i:02}.webp" for i in range(1,19)]+[d/(n+".webp") for n in ("home_banner","guidance_banner","daily_quote","verse_banner")]
          assert all(x.is_file() for x in expected), "Missing Krishna artwork"
          PY

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Bundle public-domain fallback paintings
        run: python3 scripts/fetch_art.py

      - name: Build debug APK and unsigned release bundle
        run: gradle --no-daemon --stacktrace assembleDebug bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GitaSaar-debug-APK
          if-no-files-found: error
          path: GitaSaar_Android_App_Source/GitaSaarAndroid/app/build/outputs/apk/debug/*.apk

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: GitaSaar-UNSIGNED-release-AAB
          if-no-files-found: error
          path: GitaSaar_Android_App_Source/GitaSaarAndroid/app/build/outputs/bundle/release/*.aab
