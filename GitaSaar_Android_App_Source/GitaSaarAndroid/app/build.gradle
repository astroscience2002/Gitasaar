plugins {
    id 'com.android.application'
}

def testAppId = 'ca-app-pub-3940256099942544~3347511713'
def testBannerId = 'ca-app-pub-3940256099942544/9214589741'
def suppliedAppId = (findProperty('ADMOB_APP_ID') ?: '').toString().trim()
def suppliedBannerId = (findProperty('ADMOB_BANNER_ID') ?: '').toString().trim()
def liveAdsConfigured = suppliedAppId.startsWith('ca-app-pub-') &&
    suppliedAppId.contains('~') && !suppliedAppId.equals(testAppId) &&
    suppliedBannerId.startsWith('ca-app-pub-') &&
    suppliedBannerId.contains('/') && !suppliedBannerId.equals(testBannerId)

android {
    namespace 'com.gitasaar.reader'
    compileSdk 36

    defaultConfig {
        // Ensure this package name is available in your Play Console.
        applicationId 'com.gitasaar.reader'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.2.1'
    }
    signingConfigs {
        upload {
            // The keystore is supplied at release build time, never committed to GitHub.
            if (System.getenv('PLAY_UPLOAD_KEYSTORE_FILE')) {
                storeFile file(System.getenv('PLAY_UPLOAD_KEYSTORE_FILE'))
                storePassword System.getenv('PLAY_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('PLAY_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('PLAY_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: testAppId]
            buildConfigField 'String', 'BANNER_AD_UNIT_ID', '"' + testBannerId + '"'
            buildConfigField 'boolean', 'ADS_ENABLED', 'true'
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [admobAppId: liveAdsConfigured ? suppliedAppId : testAppId]
            buildConfigField 'String', 'BANNER_AD_UNIT_ID', '"' + (liveAdsConfigured ? suppliedBannerId : testBannerId) + '"'
            // Never ship active test ads; monetization requires real AdMob IDs.
            buildConfigField 'boolean', 'ADS_ENABLED', liveAdsConfigured ? 'true' : 'false'
            if (System.getenv('PLAY_UPLOAD_KEYSTORE_FILE')) {
                signingConfig signingConfigs.upload
            }
            // Release bundle stays unsigned unless a private signing key is present.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
